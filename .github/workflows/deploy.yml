name: Deploy to VPS

on:
  push:
    branches: [ main ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # 0. Отключаем файрвол
            sudo ufw disable || true

            # 1. Жестко очищаем и клонируем репозиторий
            rm -rf ~/rgsu_bot
            git clone https://github.com/lozoker01/max-bot.git ~/rgsu_bot
            cd ~/rgsu_bot
            
            # 2. Сразу создаем все необходимые папки для документов и ресурсов
            mkdir -p ~/rgsu_bot/resources ~/rgsu_bot/docs
            
            # 3. Создаем файл .env ПЕРЕД запуском службы
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > ~/rgsu_bot/.env
            echo "MAX_BOT_TOKEN=${{ secrets.MAX_BOT_TOKEN }}" >> ~/rgsu_bot/.env
            echo "RENDER_EXTERNAL_URL=https://rgsubot.duckdns.org" >> ~/rgsu_bot/.env
            
            # 4. Настраиваем Python и зависимости
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            if [ -f "requirements.txt" ]; then
              pip install -r requirements.txt --quiet
            fi
            pip install uvicorn fastapi --quiet
            
            # 5. Настраиваем веб-сервер Nginx (HTTPS проксирование)
            sudo apt update -y && sudo apt install -y nginx
            
            sudo bash -c 'cat > /etc/nginx/sites-available/rgsubot << "EOF"
            server {
                listen 80;
                server_name rgsubot.duckdns.org;
                return 301 https://$host$request_uri;
            }
            server {
                listen 443 ssl;
                server_name rgsubot.duckdns.org;
                ssl_certificate /etc/letsencrypt/live/rgsubot.duckdns.org/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/rgsubot.duckdns.org/privkey.pem;
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF'
            
            sudo ln -sf /etc/nginx/sites-available/rgsubot /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx

            # 6. Создаем и запускаем системную службу ТОЛЬКО после того, как все файлы и папки на месте
            sudo bash -c 'cat > /etc/systemd/system/rgsubot.service << "EOF"
            [Unit]
            Description=RGSU Bot RAG Service
            After=network.target

            [Service]
            User=root
            WorkingDirectory=/root/rgsu_bot
            EnvironmentFile=/root/rgsu_bot/.env
            ExecStart=/root/rgsu_bot/venv/bin/python3 -m uvicorn main:app --host 127.0.0.1 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF'
            
            sudo systemctl daemon-reload
            sudo systemctl enable rgsubot
            sudo systemctl restart rgsubot
            
            # 7. Финальная проверка логов в Actions
            sleep 3
            sudo systemctl status rgsubot --no-pager || true
            sudo journalctl -u rgsubot -n 20 --no-pager || true
