name: Deploy to VPS

on:
  push:
    branches: [ main ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p ~/rgsu_bot
            cd ~/rgsu_bot
            
            # Автоматически создаем файл с ключами из GitHub Secrets
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
            echo "MAX_BOT_TOKEN=${{ secrets.MAX_BOT_TOKEN }}" >> .env
            
            # Клонируем или обновляем код
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/ВАШ_АККАУНТ/ВАШ_РЕПОЗИТОРИЙ.git .
            fi
            
            # Ставим зависимости и перезапускаем
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            
            # Создаем системную службу один раз автоматически, если её нет
            if [ ! -f /etc/systemd/system/rgsubot.service ]; then
              sudo bash -c 'cat > /etc/systemd/system/rgsubot.service << "EOF"
              [Unit]
              Description=RGSU Bot RAG Service
              After=network.target

              [Service]
              User=root
              WorkingDirectory=/root/rgsu_bot
              EnvironmentFile=/root/rgsu_bot/.env
              ExecStart=/root/rgsu_bot/venv/bin/uvicorn main:app --host 0.0.0.0 --port 80
              Restart=always

              [Install]
              WantedBy=multi-user.target
              EOF'
              sudo systemctl daemon-reload
              sudo systemctl enable rgsubot
            fi
            
            sudo systemctl restart rgsubot
