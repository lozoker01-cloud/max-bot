name: Deploy to VPS

on:
  push:
    branches: [ main ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 40m
          script: |
            # 0. Отключаем файрвол
            sudo ufw disable || true

            # 1. Устанавливаем системные зависимости
            sudo apt update -y
            sudo apt install -y python3-venv python3-pip nginx build-essential

            # 2. Чистим и клонируем репозиторий
            rm -rf /root/rgsu_bot
            git clone https://github.com/lozoker01-cloud/max-bot.git /root/rgsu_bot
            cd /root/rgsu_bot
            
            # 3. Находим, где лежит main.py
            MAIN_PATH=$(find /root/rgsu_bot -name "main.py" | head -n 1)
            if [ -z "$MAIN_PATH" ]; then
              echo "ERROR: main.py not found in repository!"
              exit 1
            fi
            MAIN_DIR=$(dirname "$MAIN_PATH")
            echo "Found main.py in: $MAIN_DIR"
            
            # 4. Создаем папки для ресурсов и документов
            mkdir -p "$MAIN_DIR/resources" "$MAIN_DIR/docs"
            
            # 5. Создаем файл .env
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > "$MAIN_DIR/.env"
            echo "MAX_BOT_TOKEN=${{ secrets.MAX_BOT_TOKEN }}" >> "$MAIN_DIR/.env"
            echo "RENDER_EXTERNAL_URL=https://rgsubot.duckdns.org" >> "$MAIN_DIR/.env"
            
            # 6. Настраиваем виртуальное окружение и зависимости
            python3 -m venv /root/rgsu_bot/venv
            /root/rgsu_bot/venv/bin/pip install --upgrade pip
            
            if [ -f "/root/rgsu_bot/requirements.txt" ]; then
              /root/rgsu_bot/venv/bin/pip install -r /root/rgsu_bot/requirements.txt
            fi
            
            /root/rgsu_bot/venv/bin/pip install uvicorn fastapi requests groq langchain langchain-core
            
            # 7. Настраиваем веб-сервер Nginx
            sudo bash -c 'cat > /etc/nginx/sites-available/rgsubot << "EOF"
            server {
                listen 80;
                server_name rgsubot.duckdns.org;
                return 301 https://$host$request_uri;
            }
            server {
                listen 443 ssl;
                server_name rgsubot.duckdns.org;
                ssl_certificate /etc/letsencrypt/live/rgsubot.duckdns.org/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/rgsubot.duckdns.org/privkey.pem;
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF'
            
            sudo ln -sf /etc/nginx/sites-available/rgsubot /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx

            # 8. Создаем скрипт запуска
            cat > /root/rgsu_bot/start.sh << 'EOF'
            #!/bin/bash
            cd /root/rgsu_bot
            exec /root/rgsu_bot/venv/bin/python3 -m uvicorn main:app --host 127.0.0.1 --port 8000
            EOF
            chmod +x /root/rgsu_bot/start.sh

            # 9. Создаем системную службу
            sudo rm -f /etc/systemd/system/rgsubot.service
            sudo bash -c "echo '[Unit]
            Description=RGSU Bot RAG Service
            After=network.target

            [Service]
            User=root
            WorkingDirectory=$MAIN_DIR
            EnvironmentFile=$MAIN_DIR/.env
            ExecStart=/root/rgsu_bot/start.sh
            Restart=always

            [Install]
            WantedBy=multi-user.target' > /etc/systemd/system/rgsubot.service"
            
            sudo systemctl daemon-reload
            sudo systemctl enable rgsubot
            sudo systemctl restart rgsubot
            
            # 10. Проверка порта и службы
            sleep 4
            echo "=== CHECKING PORT 8000 ==="
            ss -tulpn | grep 8000 || echo "WARNING: Port 8000 is not listening!"
            sudo systemctl status rgsubot --no-pager || true
